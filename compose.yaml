name: alerta-enchentes

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: alerta
      POSTGRES_USER: alerta
      POSTGRES_PASSWORD: alerta_local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://alerta:alerta_local@db:5432/alerta
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        ./node_modules/.bin/prisma db push --skip-generate &&
        node prisma/init-local.cjs &&
        exec node node_modules/next/dist/bin/next start --hostname 0.0.0.0
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  postgres-data:
